services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    command: npm run start:gateway
    env_file: .env
    environment:
      PROFILE_PHOTO_STORAGE_DIR: /app/uploads/profile-photos
      IDENTITY_SERVICE_HOST: identity-service
      MENU_SERVICE_HOST: menu-service
      ORDER_SERVICE_HOST: order-service
      PAYMENT_SERVICE_HOST: payment-service
    depends_on:
      - identity-service
      - menu-service
      - order-service
      - payment-service
    volumes:
      - foodmenu_profile_photos:/app/uploads/profile-photos:ro
    ports:
      - "${API_GATEWAY_PORT:-4000}:${API_GATEWAY_PORT:-4000}"

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: identity-service
    command: npm run start:identity
    env_file: .env
    environment:
      PROFILE_PHOTO_STORAGE_DIR: /app/uploads/profile-photos
      IDENTITY_SERVICE_HOST: 0.0.0.0
    depends_on:
      - postgres
    volumes:
      - foodmenu_profile_photos:/app/uploads/profile-photos
    expose:
      - "${IDENTITY_SERVICE_PORT:-4050}"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    command: npm run start:payment
    env_file: .env
    environment:
      ORDER_SERVICE_HOST: order-service
    depends_on:
      - order-service
      - postgres
    expose:
      - "${PAYMENT_SERVICE_PORT:-4010}"

  menu-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: menu-service
    command: npm run start:menu
    env_file: .env
    depends_on:
      - postgres
    expose:
      - "${MENU_SERVICE_PORT:-4020}"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    command: npm run start:order
    env_file: .env
    depends_on:
      - postgres
    expose:
      - "${ORDER_SERVICE_PORT:-4030}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodmenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodmenu}
      POSTGRES_DB: ${POSTGRES_DB:-foodmenu_api}
    ports:
      - "5432:5432"
    volumes:
      - foodmenu_postgres_data:/var/lib/postgresql/data

  #pgadmin:
  #  image: dpage/pgadmin4:8
  #  restart: unless-stopped
  #  environment:
  #    PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@foodmenu.local}
  #    PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
  #  depends_on:
  #    - postgres
  #  ports:
  #    - "5050:80"
  #  volumes:
  #    - foodmenu_pgadmin_data:/var/lib/pgadmin

volumes:
  foodmenu_profile_photos:
  foodmenu_postgres_data:
  #foodmenu_pgadmin_data:
